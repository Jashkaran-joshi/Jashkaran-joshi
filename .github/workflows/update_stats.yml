name: Update GitHub Stats SVGs

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Stats Generator
        run: python update_stats.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/profile-details.svg assets/repos-per-language.svg assets/most-commit-language.svg assets/streak.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update github stats svgs" && git push)
